<!-- Форма -->  
<form action="javascript: pass()">

<input id="parole" type="password" name="psw">

<script>
 function pass(){
  var enteredText=document.getElementById('parole').value;
  //
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
    
    if(enteredText==xhttp.responseText) {
	loadDoc('next.txt', myFunction);
  } else{
  again();
  };
  };
  };
  xhttp.open("GET", "temporary.txt", true);
  xhttp.send();
  }
function loadDoc(url, cFunction) {
  var xhttp;
  xhttp=new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      cFunction(this);
    }
  };
  xhttp.open("GET", url, true);
  xhttp.send();
}
function myFunction(xhttp) {
  document.write(xhttp.responseText);
}


function again(){
alert("Не верный пароль. Попробуйте еще раз");
location.reload();
}
</script>
